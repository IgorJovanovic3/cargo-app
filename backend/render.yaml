services:
  - type: web
    name: cargo-backend
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cargo-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true